name: Production readiness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: repodoc
          POSTGRES_PASSWORD: repodoc
          POSTGRES_DB: repodoc
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U repodoc -d repodoc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://repodoc:repodoc@127.0.0.1:5432/repodoc
      DIRECT_URL: postgresql://repodoc:repodoc@127.0.0.1:5432/repodoc
      TEST_DATABASE_URL: postgresql://repodoc:repodoc@127.0.0.1:5432/repodoc
      NEXT_PUBLIC_SITE_URL: https://repodoc.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bunx prisma validate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:integration
      - run: bun run db:migrate
      - run: bun run db:migrate
      - run: bun run db:status
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
