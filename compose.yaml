services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: repodoc
      POSTGRES_PASSWORD: repodoc
      POSTGRES_DB: repodoc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repodoc -d repodoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
